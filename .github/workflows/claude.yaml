name: Claude agent

# Works on issues through pull requests only: the action commits to a `claude/`
# branch and never pushes to `main`. It starts only when the repo owner labels an
# issue `ready-for-agent` or mentions @claude in an issue or pull request comment.
# Durable instructions live in CLAUDE.md, which Claude Code reads on every run.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  issue:
    if: >-
      github.event_name == 'issues'
      && github.event.label.name == 'ready-for-agent'
      && github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install -r requirements_test.txt "$(grep '^ruff==' requirements.txt)"

      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c  # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: ready-for-agent
          track_progress: true
          prompt: |
            Work on issue #${{ github.event.issue.number }} of ${{ github.repository }}.
            Read CLAUDE.md, docs/dev/MEMORY.md and the issue with its comments first, and follow the rules in CLAUDE.md.
            Implement the change with tests, then run `python -m pytest tests/` and `bash scripts/lint`; both must pass.
            Never bump the version in manifest.json and never push to main.
            Commit on your branch and open a pull request against main with `gh pr create`, its body ending with "Closes #${{ github.event.issue.number }}".
            If the issue is unclear or needs the owner's decision, do not guess: comment on the issue with your questions and stop.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Bash(python -m pytest:*),Bash(bash scripts/lint),Bash(ruff:*),Bash(git:*),Bash(gh pr create:*),Bash(gh issue view:*),Bash(gh issue comment:*)"

  mention:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
      && contains(github.event.comment.body, '@claude')
      && github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install -r requirements_test.txt "$(grep '^ruff==' requirements.txt)"

      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c  # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Bash(python -m pytest:*),Bash(bash scripts/lint),Bash(ruff:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh issue view:*)"
