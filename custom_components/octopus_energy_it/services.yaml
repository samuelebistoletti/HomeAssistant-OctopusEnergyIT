set_device_preferences:
  fields:
    device_id:
      required: true
      example: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      selector:
        text:
    target_percentage:
      required: true
      default: 80
      example: 80
      selector:
        number:
          min: 10
          max: 100
          step: 1
          unit_of_measurement: "%"
    target_time:
      required: true
      default: "06:00"
      example: "06:00"
      selector:
        time:

boost_charge:
  fields:
    device_id:
      required: true
      example: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      selector:
        text:
    target_percentage:
      required: false
      example: 80
      selector:
        number:
          min: 10
          max: 100
          step: 1
          unit_of_measurement: "%"
    end_time:
      required: false
      selector:
        datetime:
