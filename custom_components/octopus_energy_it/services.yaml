set_device_preferences:
  fields:
    device_id:
      required: true
      example: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      selector:
        text:
    target_percentage:
      required: true
      default: 80
      example: 80
      selector:
        number:
          min: 10
          max: 100
          step: 1
          unit_of_measurement: "%"
    target_time:
      required: true
      default: "06:00"
      example: "06:00"
      selector:
        time:

boost_charge:
  fields:
    device_id:
      required: true
      example: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      selector:
        text:
    target_percentage:
      required: false
      example: 80
      selector:
        number:
          min: 10
          max: 100
          step: 1
          unit_of_measurement: "%"
    end_time:
      required: false
      selector:
        datetime:

submit_gas_reading:
  fields:
    reading:
      required: true
      example: 1234
      selector:
        number:
          min: 0
          max: 99999999
          step: 1
          mode: box
          unit_of_measurement: "m³"
    reading_date:
      required: false
      selector:
        date:
    account_number:
      required: false
      example: "A-1234ABCD"
      selector:
        text:
